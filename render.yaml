services:
  - type: web
    name: aspen-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: >
      cd backend &&
      python -c "from database import init_db; init_db()" &&
      alembic upgrade head &&
      python scripts/seed.py &&
      uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: https://aspen.vercel.app,http://localhost:5173
      - key: EXCEL_PATH
        value: ""
      - key: PYTHON_VERSION
        value: 3.12.0
